appId: com.leigh.dictate.preview
productName: Dictate Preview
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: resources/tray
    to: tray
mac:
  identity: null
  hardenedRuntime: false
  extendInfo:
    LSUIElement: true
    NSMicrophoneUsageDescription: Dictate listens only while you are dictating, and audio never leaves your Mac.
    NSAudioCaptureUsageDescription: Dictate records call audio only when you start meeting notes.
npmRebuild: false
